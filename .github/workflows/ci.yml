name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check index.js
          node --check weread.js
          node --check client.js
          node --check tests/smoke.mjs
      - name: Offline tests (headless render + route contract)
        run: |
          node tests/smoke.mjs
          node tests/host.mjs